name: CI

on:
  push:
    branches:
      - main
      - support/zig-0.16
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ZIG_VERSION: 0.16.0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        timeout-minutes: 2
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Zig
        timeout-minutes: 5
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
          cache-key: checks-zig-${{ env.ZIG_VERSION }}

      - name: Show Zig version
        timeout-minutes: 1
        run: zig version

      - name: Check formatting
        timeout-minutes: 2
        run: zig fmt --check build.zig build.zig.zon src test

      - name: Check safe API coverage
        shell: bash
        timeout-minutes: 2
        run: bash tools/check-api-coverage.sh

  native:
    name: native-${{ matrix.name }}-${{ matrix.optimize }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-24.04
            optimize: Debug
          - name: linux-x64
            runner: ubuntu-24.04
            optimize: ReleaseSafe
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            optimize: Debug
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            optimize: ReleaseSafe
          - name: windows-x64
            runner: windows-2025
            optimize: Debug
          - name: windows-x64
            runner: windows-2025
            optimize: ReleaseSafe
          - name: macos-x64
            runner: macos-15-intel
            optimize: Debug
          - name: macos-x64
            runner: macos-15-intel
            optimize: ReleaseSafe
          - name: macos-arm64
            runner: macos-14
            optimize: Debug
          - name: macos-arm64
            runner: macos-14
            optimize: ReleaseSafe

    steps:
      - name: Checkout
        timeout-minutes: 2
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Zig
        timeout-minutes: 5
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
          cache-key: native-${{ matrix.name }}-${{ matrix.optimize }}-zig-${{ env.ZIG_VERSION }}

      - name: Show Zig version
        timeout-minutes: 1
        run: zig version

      - name: Run tests
        timeout-minutes: 10
        run: zig build test -Doptimize=${{ matrix.optimize }} --summary all

      - name: Run consumer integration test
        working-directory: test/consumer
        timeout-minutes: 5
        run: zig build test -Doptimize=${{ matrix.optimize }} --summary all

      - name: Build library
        timeout-minutes: 5
        run: zig build -Doptimize=${{ matrix.optimize }} --summary all

  memory:
    name: memory-valgrind
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        timeout-minutes: 2
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Zig
        timeout-minutes: 5
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
          cache-key: memory-valgrind-zig-${{ env.ZIG_VERSION }}

      - name: Install Valgrind
        timeout-minutes: 5
        run: |
          sudo apt update
          sudo apt-get install -y valgrind

      - name: Run tests under Valgrind
        timeout-minutes: 10
        run: zig build test-valgrind -Dtarget=x86_64-linux-gnu -Dcpu=baseline --summary all

  cross-compile:
    name: cross-${{ matrix.target }}-${{ matrix.optimize }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        optimize:
          - Debug
          - ReleaseSafe
        target:
          - x86_64-linux-musl
          - aarch64-linux-musl
          - x86_64-windows-gnu
          - aarch64-windows-gnu

    steps:
      - name: Checkout
        timeout-minutes: 2
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Zig
        timeout-minutes: 5
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
          cache-key: cross-${{ matrix.target }}-${{ matrix.optimize }}-zig-${{ env.ZIG_VERSION }}

      - name: Cross-compile library
        timeout-minutes: 5
        run: zig build -Dtarget=${{ matrix.target }} -Doptimize=${{ matrix.optimize }} --summary all
